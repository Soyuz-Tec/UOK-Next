name: Foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify architecture foundation
        shell: pwsh
        run: .\scripts\verify_foundation.ps1
      - name: Verify code discipline
        shell: pwsh
        run: .\scripts\verify_code_discipline.ps1
