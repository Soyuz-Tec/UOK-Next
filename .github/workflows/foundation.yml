name: Foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: uok-next-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-foundation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify architecture foundation
        shell: pwsh
        run: .\scripts\verify_foundation.ps1
      - name: Negative-test external identity policy
        shell: pwsh
        run: .\test\architecture\external_identity_policy_test.ps1
      - name: Verify web foundation policy
        shell: pwsh
        run: .\scripts\verify_web_foundation.ps1
      - name: Verify code discipline
        shell: pwsh
        run: .\scripts\verify_code_discipline.ps1
      - name: Verify module boundaries
        shell: pwsh
        run: .\scripts\verify_architecture_boundaries.ps1
      - name: Verify PostgreSQL architecture policy
        shell: pwsh
        run: .\scripts\verify_database_policy.ps1
      - name: Verify object-storage architecture policy
        shell: pwsh
        run: .\scripts\verify_object_storage_policy.ps1
      - name: Verify artifact-integrity control
        shell: pwsh
        run: .\test\security\artifact_integrity_test.ps1
      - name: Verify clone-local credential ACL
        shell: pwsh
        run: .\test\security\local_credential_acl_test.ps1

  verify-application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: docker.io/library/postgres@sha256:d37ce87b33b80bd76fb8d9bc9ff6ad2caaf6c4a50caf9ae25e393f247fc01d6e
        env:
          POSTGRES_USER: uok_next
          POSTGRES_PASSWORD: uok_next_ci_only_0123456789abcdef
          POSTGRES_DB: uok_next_test
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=builtin --builtin-locale=PG_UNICODE_FAST --data-checksums --auth-host=scram-sha-256
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uok_next -d uok_next_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
      object-store:
        image: docker.io/chrislusf/seaweedfs@sha256:f898c91e42d7da5f4bb13f1efd424ff03ba85b420312eb929708a384e8a8b03d
        env:
          AWS_ACCESS_KEY_ID: uok_ci_object_store_access_01
          AWS_SECRET_ACCESS_KEY: uok_ci_object_store_secret_0123456789abcdef
          S3_BUCKET: uok-evidence
        ports:
          - 8333:8333
        options: >-
          --user 10001:10001
          --read-only
          --tmpfs /tmp:rw,size=33554432,mode=1777
          --tmpfs /data:rw,size=268435456,mode=1777
          --cap-drop ALL
          --security-opt no-new-privileges:true
          --pids-limit 256
          --memory 512m
          --cpus 1.0
          --health-cmd "curl -fsS http://127.0.0.1:9333/cluster/status"
          --health-interval 3s
          --health-timeout 2s
          --health-retries 20
    env:
      MIX_ENV: test
      UOK_DB_HOST: 127.0.0.1
      UOK_DB_PORT: 5432
      UOK_DB_USER: uok_next
      UOK_DB_PASSWORD: uok_next_ci_only_0123456789abcdef
      UOK_TEST_DB_NAME: uok_next_test
      UOK_BUILD_REVISION: ${{ github.sha }}
      UOK_OBJECT_STORE_INTEGRATION: "true"
      UOK_OBJECT_STORE_TEST_HOST: 127.0.0.1
      UOK_OBJECT_STORE_TEST_PORT: 8333
      UOK_OBJECT_STORE_ACCESS_KEY: uok_ci_object_store_access_01
      UOK_OBJECT_STORE_SECRET_KEY: uok_ci_object_store_secret_0123456789abcdef
      UOK_OBJECT_STORE_BUCKET: uok-evidence
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --prefix web --ignore-scripts --no-audit --no-fund
      - name: Verify web application
        run: npm run quality --prefix web
      - name: Audit npm advisories
        run: npm audit --prefix web --audit-level=high
      - name: Install pinned Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.4"
          elixir-version: "1.20.2"
      - name: Fetch dependencies
        run: mix deps.get
      - name: Verify PostgreSQL 19 cluster baseline
        env:
          PGPASSWORD: uok_next_ci_only_0123456789abcdef
        run: >-
          psql
          --host 127.0.0.1
          --username uok_next
          --dbname uok_next_test
          --set ON_ERROR_STOP=1
          --file deploy/postgres/verify_core_baseline.sql
      - name: Verify application
        run: mix quality
      - name: Audit Hex advisories
        run: mix hex.audit
      - name: Verify fail-closed production security configuration
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
          DATABASE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          OBJECT_STORE_URL: https://objects.example.invalid
          OBJECT_STORE_ACCESS_KEY: uok_ci_object_store_access_01
          OBJECT_STORE_SECRET_KEY: uok_ci_object_store_secret_0123456789abcdef
          OBJECT_STORE_BUCKET: uok-evidence
        run: mix run --no-start scripts/verify_production_security.exs
      - name: Reject missing object-store credentials
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
          DATABASE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          OBJECT_STORE_URL: https://objects.example.invalid
          OBJECT_STORE_ACCESS_KEY: uok_ci_object_store_access_01
          OBJECT_STORE_BUCKET: uok-evidence
        run: |
          if mix run --no-start -e 'System.halt(0)'; then
            echo "Production unexpectedly accepted a missing object-store secret"
            exit 1
          fi
      - name: Reject plaintext production object storage
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
          DATABASE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          OBJECT_STORE_URL: http://objects.example.invalid
          OBJECT_STORE_ACCESS_KEY: uok_ci_object_store_access_01
          OBJECT_STORE_SECRET_KEY: uok_ci_object_store_secret_0123456789abcdef
          OBJECT_STORE_BUCKET: uok-evidence
        run: |
          if mix run --no-start -e 'System.halt(0)'; then
            echo "Production unexpectedly accepted plaintext object storage"
            exit 1
          fi
      - name: Reject database URL TLS-policy overrides
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next?ssl=false
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
          DATABASE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          if mix run --no-start -e 'System.halt(0)'; then
            echo "DATABASE_URL unexpectedly overrode the repository-owned SSL policy"
            exit 1
          fi
      - name: Reject missing database CA trust
        env:
          MIX_ENV: prod
          UOK_BUILD_REVISION: ${{ github.sha }}
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
        run: |
          if mix run --no-start -e 'System.halt(0)'; then
            echo "Production unexpectedly accepted a missing database CA trust file"
            exit 1
          fi
      - name: Reject database URL resource-policy overrides
        env:
          MIX_ENV: prod
          UOK_BUILD_REVISION: ${{ github.sha }}
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next?pool_size=1000000
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
          DATABASE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
        run: |
          if mix run --no-start -e 'System.halt(0)'; then
            echo "DATABASE_URL unexpectedly overrode repository-owned resource bounds"
            exit 1
          fi
      - name: Verify isolated local qualification profile
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://uok_next:ci_only@postgres/uok_next
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: localhost
          UOK_DEPLOYMENT_PROFILE: local_qualification
          METRICS_ACCESS_TOKEN: local-qualification-ci-metrics-token
          OBJECT_STORE_URL: http://object-store:8333
          OBJECT_STORE_ACCESS_KEY: uok_ci_object_store_access_01
          OBJECT_STORE_SECRET_KEY: uok_ci_object_store_secret_0123456789abcdef
          OBJECT_STORE_BUCKET: uok-evidence
        run: mix run --no-start scripts/verify_local_qualification_security.exs
      - name: Reject invalid bounded runtime settings
        env:
          MIX_ENV: prod
          DATABASE_URL: ecto://uok_next:ci_only@db.example.invalid/uok_next
          SECRET_KEY_BASE: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PHX_HOST: uok-next.example.invalid
          DATABASE_CA_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
          PORT: 0
        run: |
          if mix run --no-start -e 'System.halt(0)'; then
            echo "An invalid production port unexpectedly passed runtime validation"
            exit 1
          fi

  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build immutable release image
        run: >-
          docker build
          --file Containerfile
          --build-arg UOK_REVISION=${{ github.sha }}
          --tag uok-next:${{ github.sha }}
          .
      - name: Verify non-root runtime identity
        run: |
          test "$(docker image inspect uok-next:${{ github.sha }} --format '{{.Config.User}}')" = "10001:10001"
