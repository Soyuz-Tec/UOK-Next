name: uok-next

x-runtime-environment: &runtime_environment
  SECRET_KEY_BASE: ${UOK_LOCAL_SECRET_KEY_BASE:?set UOK_LOCAL_SECRET_KEY_BASE}
  PHX_HOST: localhost
  PORT: 4000
  PHX_SERVER: "true"
  UOK_DEPLOYMENT_PROFILE: local_qualification
  UOK_LOCAL_ACCESS_CODE: ${UOK_LOCAL_ACCESS_CODE:?set UOK_LOCAL_ACCESS_CODE}
  UOK_LOCAL_TENANT_ID: ${UOK_LOCAL_TENANT_ID:?set UOK_LOCAL_TENANT_ID}
  UOK_LOCAL_ACTOR_ID: ${UOK_LOCAL_ACTOR_ID:?set UOK_LOCAL_ACTOR_ID}
  METRICS_ACCESS_TOKEN: ${UOK_LOCAL_METRICS_TOKEN:?set UOK_LOCAL_METRICS_TOKEN}
  POOL_SIZE: 5
  OBJECT_STORE_URL: http://object-store:8333
  OBJECT_STORE_ACCESS_KEY: ${UOK_OBJECT_STORE_ACCESS_KEY:?set UOK_OBJECT_STORE_ACCESS_KEY}
  OBJECT_STORE_SECRET_KEY: ${UOK_OBJECT_STORE_SECRET_KEY:?set UOK_OBJECT_STORE_SECRET_KEY}
  OBJECT_STORE_BUCKET: ${UOK_OBJECT_STORE_BUCKET:-uok-evidence}
  OBJECT_STORE_REGION: us-east-1
  OBJECT_STORE_MAX_OBJECT_BYTES: 8388608
  OUTBOX_DATABASE_URL: ecto://uok_outbox:${UOK_OUTBOX_DB_PASSWORD:?set UOK_OUTBOX_DB_PASSWORD}@postgres:5432/${UOK_DB_NAME:-uok_next_dev}
  OUTBOX_POOL_SIZE: 2
  OUTBOX_POLL_INTERVAL_MS: 1000
  OUTBOX_BATCH_SIZE: 25
  OUTBOX_LEASE_MS: 30000
  OUTBOX_MAX_ATTEMPTS: 5
  OUTBOX_BASE_BACKOFF_MS: 1000
  OUTBOX_MAX_BACKOFF_MS: 60000

services:
  postgres:
    image: docker.io/library/postgres@sha256:d37ce87b33b80bd76fb8d9bc9ff6ad2caaf6c4a50caf9ae25e393f247fc01d6e
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UOK_DB_USER:-uok_next}
      POSTGRES_PASSWORD: ${UOK_DB_PASSWORD:?set UOK_DB_PASSWORD}
      POSTGRES_DB: ${UOK_DB_NAME:-uok_next_dev}
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale-provider=builtin
        --builtin-locale=PG_UNICODE_FAST
        --data-checksums
        --auth-host=scram-sha-256
      TZ: UTC
      UOK_APP_DB_PASSWORD: ${UOK_APP_DB_PASSWORD:?set UOK_APP_DB_PASSWORD}
      UOK_OUTBOX_DB_PASSWORD: ${UOK_OUTBOX_DB_PASSWORD:?set UOK_OUTBOX_DB_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=50
      - -c
      - reserved_connections=5
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_autovacuum_min_duration=1000
    ports:
      - "127.0.0.1:${UOK_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - uok_next_postgres19_data:/var/lib/postgresql
      - ./deploy/local:/qualification:ro
      - ./deploy/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/20-uok-platform.sql:ro
      - ./deploy/postgres:/database-baseline:ro

  object-store-init:
    image: docker.io/library/alpine@sha256:fd791d74b68913cbb027c6546007b3f0d3bc45125f797758156952bc2d6daf40
    command:
      - sh
      - -ec
      - >-
        if [ "$(stat -c %u /data)" != 10001 ] || [ "$(stat -c %g /data)" != 10001 ]; then
          chown 10001:10001 /data && chmod 0700 /data;
        fi;
        find /data -mindepth 1 \( ! -user 10001 -o ! -group 10001 \)
        -exec chown 10001:10001 {} +
    restart: "no"
    volumes:
      - uok_next_object_store_data:/data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true

  object-store:
    image: docker.io/chrislusf/seaweedfs@sha256:f898c91e42d7da5f4bb13f1efd424ff03ba85b420312eb929708a384e8a8b03d
    command:
      - mini
      - -dir=/data
      - -admin.dataDir=/data/admin
      - -admin.ui=false
      - -webdav=false
      - -s3.iam=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -s3.allowedOrigins=http://localhost.invalid
      - -filer.disableDirListing=true
      - -filer.exposeDirectoryData=false
      - -filer.ui.deleteDir=false
      - -master.telemetry=false
      - -volume.allowUntrustedRemoteEndpoints=false
      - -volume.fileSizeLimitMB=16
      - -volume.concurrentUploadLimitMB=16
      - -volume.concurrentDownloadLimitMB=16
      - -filer.concurrentUploadLimitMB=16
      - -s3.concurrentUploadLimitMB=16
    restart: unless-stopped
    user: "10001:10001"
    environment:
      AWS_ACCESS_KEY_ID: ${UOK_OBJECT_STORE_ACCESS_KEY:?set UOK_OBJECT_STORE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${UOK_OBJECT_STORE_SECRET_KEY:?set UOK_OBJECT_STORE_SECRET_KEY}
      S3_BUCKET: ${UOK_OBJECT_STORE_BUCKET:-uok-evidence}
    depends_on:
      object-store-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${UOK_OBJECT_STORE_PORT:-18333}:8333"
    volumes:
      - uok_next_object_store_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9333/cluster/status"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 10s

  migrate:
    image: localhost/uok-next:${UOK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Containerfile
      args:
        UOK_REVISION: ${UOK_REVISION:?set UOK_REVISION}
    command: ["eval", "UokNext.Release.migrate()"]
    restart: "no"
    environment:
      <<: *runtime_environment
      DATABASE_URL: ecto://${UOK_DB_USER:-uok_next}:${UOK_DB_PASSWORD:?set UOK_DB_PASSWORD}@postgres:5432/${UOK_DB_NAME:-uok_next_dev}
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app-a: &app_service
    image: localhost/uok-next:${UOK_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *runtime_environment
      DATABASE_URL: ecto://uok_app:${UOK_APP_DB_PASSWORD:?set UOK_APP_DB_PASSWORD}@postgres:5432/${UOK_DB_NAME:-uok_next_dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s

  app-b:
    <<: *app_service

  proxy:
    image: docker.io/library/haproxy@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047
    restart: unless-stopped
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UOK_HTTP_PORT:-18089}:8080"
    volumes:
      - ./deploy/local/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  uok_next_postgres19_data:
  uok_next_object_store_data:
