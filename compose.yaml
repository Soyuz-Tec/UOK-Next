name: uok-next

x-runtime-environment: &runtime_environment
  SECRET_KEY_BASE: ${UOK_LOCAL_SECRET_KEY_BASE:?set UOK_LOCAL_SECRET_KEY_BASE}
  PHX_HOST: localhost
  PORT: 4000
  PHX_SERVER: "true"
  UOK_DEPLOYMENT_PROFILE: local_qualification
  METRICS_ACCESS_TOKEN: ${UOK_LOCAL_METRICS_TOKEN:?set UOK_LOCAL_METRICS_TOKEN}
  POOL_SIZE: 5

services:
  postgres:
    image: docker.io/library/postgres@sha256:d37ce87b33b80bd76fb8d9bc9ff6ad2caaf6c4a50caf9ae25e393f247fc01d6e
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${UOK_DB_USER:-uok_next}
      POSTGRES_PASSWORD: ${UOK_DB_PASSWORD:?set UOK_DB_PASSWORD}
      POSTGRES_DB: ${UOK_DB_NAME:-uok_next_dev}
      POSTGRES_INITDB_ARGS: >-
        --encoding=UTF8
        --locale-provider=builtin
        --builtin-locale=PG_UNICODE_FAST
        --data-checksums
        --auth-host=scram-sha-256
      TZ: UTC
      UOK_APP_DB_PASSWORD: ${UOK_APP_DB_PASSWORD:?set UOK_APP_DB_PASSWORD}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=50
      - -c
      - reserved_connections=5
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_lock_waits=on
      - -c
      - log_min_duration_statement=500
      - -c
      - log_autovacuum_min_duration=1000
    ports:
      - "127.0.0.1:${UOK_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - uok_next_postgres19_data:/var/lib/postgresql
      - ./deploy/local:/qualification:ro
      - ./deploy/postgres/bootstrap.sql:/docker-entrypoint-initdb.d/20-uok-platform.sql:ro
      - ./deploy/postgres:/database-baseline:ro

  migrate:
    image: localhost/uok-next:${UOK_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Containerfile
      args:
        UOK_REVISION: ${UOK_REVISION:?set UOK_REVISION}
    command: ["eval", "UokNext.Release.migrate()"]
    restart: "no"
    environment:
      <<: *runtime_environment
      DATABASE_URL: ecto://${UOK_DB_USER:-uok_next}:${UOK_DB_PASSWORD:?set UOK_DB_PASSWORD}@postgres:5432/${UOK_DB_NAME:-uok_next_dev}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  app-a: &app_service
    image: localhost/uok-next:${UOK_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *runtime_environment
      DATABASE_URL: ecto://uok_app:${UOK_APP_DB_PASSWORD:?set UOK_APP_DB_PASSWORD}@postgres:5432/${UOK_DB_NAME:-uok_next_dev}
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s

  app-b:
    <<: *app_service

  proxy:
    image: docker.io/library/haproxy@sha256:79799e8b2977e60802774fa53d29e6b54e045402cdd8a8b9fe43923e7095a047
    restart: unless-stopped
    depends_on:
      app-a:
        condition: service_healthy
      app-b:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UOK_HTTP_PORT:-18089}:8080"
    volumes:
      - ./deploy/local/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

volumes:
  uok_next_postgres19_data:
